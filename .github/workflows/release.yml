name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/lock

      - name: Strip binary (Windows)
        if: runner.os == 'Windows'
        run: strip target/${{ matrix.target }}/release/lock.exe

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: lock-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/lock*

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Prepare release assets
        run: |
          mkdir -p release
          for artifact in lock-*; do
            if [ -d "$artifact" ]; then
              platform=$(echo "$artifact" | sed 's/lock-//')
              if [ -f "$artifact/lock" ]; then
                cp "$artifact/lock" "release/lock-$platform"
                chmod +x "release/lock-$platform"
              elif [ -f "$artifact/lock.exe" ]; then
                cp "$artifact/lock.exe" "release/lock-$platform.exe"
              fi
            fi
          done

      - name: Create checksums
        run: |
          cd release
          for file in lock-*; do
            if [ -f "$file" ]; then
              sha256sum "$file" > "$file.sha256"
            fi
          done

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## Changes in ${{ steps.version.outputs.VERSION }}
            
            ### Installation
            
            **Quick Install:**
            ```bash
            curl -sSL https://raw.githubusercontent.com/elly-hacen/lock-rs/main/install.sh | bash
            ```
            
            **Manual Install:**
            ```bash
            # Download and run installer
            curl -sSL https://raw.githubusercontent.com/elly-hacen/lock-rs/main/install.sh -o install.sh
            chmod +x install.sh
            ./install.sh
            ```
            
            ### Supported Platforms
            
            - Linux x86_64
            - macOS x86_64
            - macOS aarch64
            - Windows x86_64
            
            ### Verification
            
            Verify your download with the provided SHA256 checksums.
          files: |
            release/*
          draft: false
          prerelease: false
