[package]
name = "lock"
version = "0.1.0"
edition = "2024"
description = "Yet another paranoid lock - zerodize your personal pixels before they hit the cloud."

[dependencies]
clap = { version = "4.5.48", features = ["derive"]}
anyhow = "1.0.100"
rand = "0.9.2"
zeroize = "1.8.2"
hex = "0.4.3"
colored = "3.0.0"
aes-gcm = "0.10.3"
tempfile = "3.23.0"
walkdir = "2.5.0"
argon2 = "0.5.3"
rpassword = "7.4.0"

[lib]
name = "lock"
path = "src/lib.rs"

[[bin]]
name = "lock"
path = "src/main.rs"
