[package]
name = "lock"
version = "0.1.0"
edition = "2024"
description = "Yet another paranoid lock - zerodize your personal pixels before they hit the cloud."

# Optimize for smaller binary size and faster compilation
[profile.dev]
opt-level = 1          # Enable some optimizations even in dev
debug = 1              # Reduce debug info
incremental = true     # Enable incremental compilation

[profile.release]
opt-level = "z"        # Optimize for size
lto = true            # Link-time optimization
codegen-units = 1     # Single codegen unit for better optimization
panic = "abort"       # Smaller panic handling
strip = true          # Strip debug symbols
overflow-checks = false # Disable overflow checks for better performance

[dependencies]
clap = { version = "4.5.48", features = ["derive", "env"]}
anyhow = "1.0.100"
rand = { version = "0.9.2", default-features = false, features = ["std", "os_rng"] }
zeroize = "1.8.2"
hex = "0.4.3"
aes-gcm = "0.10.3"
argon2 = "0.5.3"
walkdir = "2.5.0"
tempfile = "3.23.0"
colored = "3.0.0"
indicatif = { version = "0.18.0", default-features = false }
rpassword = "7.4.0"
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread", "net", "io-util", "time"], default-features = false }
reqwest = { version = "0.12.23", features = ["json", "rustls-tls"], default-features = false }
octocrab = { version = "0.47.0", default-features = false, features = ["default"] }
base64 = "0.22.1"
rayon = "1.11.0"
serde_json = "1.0.145"

[lib]
name = "lock"
path = "src/lib.rs"

[[bin]]
name = "lock"
path = "src/main.rs"
